name: flux
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
      POSTGRES_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-true}
      USUARIO_INICIAL_EMAIL: ${USUARIO_INICIAL_EMAIL:-}
      USUARIO_INICIAL_SENHA: ${USUARIO_INICIAL_SENHA:-}
      USUARIO_INICIAL_NOME: ${USUARIO_INICIAL_NOME:-}
      APP_URL_BASE: ${APP_URL_BASE:?defina APP_URL_BASE no .env}
      APP_CADASTRO_PUBLICO: ${APP_CADASTRO_PUBLICO:-false}
      APP_CONTROLADOR_NOME: ${APP_CONTROLADOR_NOME:-}
      APP_CONTROLADOR_EMAIL: ${APP_CONTROLADOR_EMAIL:-}
      APP_EMAIL_REMETENTE: ${APP_EMAIL_REMETENTE:?defina APP_EMAIL_REMETENTE no .env}
      MAIL_HOST: ${MAIL_HOST:?defina MAIL_HOST no .env}
      MAIL_PORTA: ${MAIL_PORTA:-587}
      MAIL_USUARIO: ${MAIL_USUARIO:-}
      MAIL_SENHA: ${MAIL_SENHA:-}
      MAIL_AUTENTICACAO: ${MAIL_AUTENTICACAO:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORTA:-80}:80"
volumes:
  dados_postgres:
