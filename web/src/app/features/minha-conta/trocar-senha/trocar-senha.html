<app-cabecalho-pagina titulo="Trocar senha" subtitulo="Ao trocar a senha, todas as sessões abertas são encerradas." />
<div class="flux-conteudo">
  <a class="flux-voltar" routerLink="/minha-conta"><app-icone nome="esquerda" [tamanho]="16" />Minha conta</a>
  <app-card class="trocar-senha">
    <form class="trocar-senha__formulario" [formGroup]="formulario" (ngSubmit)="salvar()">
      <div class="flux-campo">
        <label for="trocar-senha-atual">Senha atual</label>
        <div class="flux-entrada" [class.flux-entrada--invalida]="erroSenhaAtual() !== null">
          <input id="trocar-senha-atual" type="password" formControlName="senhaAtual" autocomplete="current-password" [attr.aria-invalid]="erroSenhaAtual() !== null ? 'true' : null" [attr.aria-describedby]="erroSenhaAtual() !== null ? 'trocar-senha-atual-erro' : null" />
        </div>
        @if (erroSenhaAtual(); as mensagem) {
          <p id="trocar-senha-atual-erro" class="flux-campo__erro">{{ mensagem }}</p>
        }
      </div>
      <div class="flux-campo">
        <label for="trocar-senha-nova">Nova senha</label>
        <div class="flux-entrada" [class.flux-entrada--invalida]="erroNovaSenha() !== null">
          <input id="trocar-senha-nova" type="password" formControlName="novaSenha" autocomplete="new-password" [attr.aria-invalid]="erroNovaSenha() !== null ? 'true' : null" [attr.aria-describedby]="erroNovaSenha() !== null ? 'trocar-senha-nova-erro' : null" />
        </div>
        @if (erroNovaSenha(); as mensagem) {
          <p id="trocar-senha-nova-erro" class="flux-campo__erro">{{ mensagem }}</p>
        }
      </div>
      <div class="flux-campo">
        <label for="trocar-senha-confirmacao">Confirmar nova senha</label>
        <div class="flux-entrada" [class.flux-entrada--invalida]="erroConfirmacao() !== null">
          <input id="trocar-senha-confirmacao" type="password" formControlName="confirmarNovaSenha" autocomplete="new-password" [attr.aria-invalid]="erroConfirmacao() !== null ? 'true' : null" [attr.aria-describedby]="erroConfirmacao() !== null ? 'trocar-senha-confirmacao-erro' : null" />
        </div>
        @if (erroConfirmacao(); as mensagem) {
          <p id="trocar-senha-confirmacao-erro" class="flux-campo__erro">{{ mensagem }}</p>
        }
      </div>
      @if (erro(); as mensagem) {
        <app-alerta tipo="erro" [icone]="mensagem === muitasTentativas ? 'relogio' : 'alerta'" [titulo]="mensagem" />
      }
      <button mat-flat-button type="submit">Salvar</button>
    </form>
  </app-card>
</div>
