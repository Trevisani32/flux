<main class="entrar">
  <app-painel-marca />
  <div class="entrar__lado">
    <form class="entrar__formulario" [formGroup]="formulario" (ngSubmit)="entrar()">
      <div class="entrar__titulos">
        <h1>Entrar</h1>
        <p>Que bom ver você de novo. Use o e-mail e a senha da sua conta.</p>
      </div>
      <div class="flux-campo">
        <label for="entrar-email">E-mail</label>
        <div class="flux-entrada" [class.flux-entrada--invalida]="erroEmail() !== null">
          <input id="entrar-email" type="email" formControlName="email" autocomplete="username" [attr.aria-invalid]="erroEmail() !== null ? 'true' : null" [attr.aria-describedby]="erroEmail() !== null ? 'entrar-email-erro' : null" />
        </div>
        @if (erroEmail(); as mensagem) {
          <p id="entrar-email-erro" class="flux-campo__erro">{{ mensagem }}</p>
        }
      </div>
      <div class="flux-campo">
        <label for="entrar-senha">Senha</label>
        <div class="flux-entrada" [class.flux-entrada--invalida]="erroSenha() !== null">
          <input id="entrar-senha" [type]="senhaVisivel() ? 'text' : 'password'" formControlName="senha" autocomplete="current-password" [attr.aria-invalid]="erroSenha() !== null ? 'true' : null" [attr.aria-describedby]="erroSenha() !== null ? 'entrar-senha-erro' : null" />
          <button type="button" class="flux-botao-olho" aria-label="Mostrar senha" aria-controls="entrar-senha" [attr.aria-pressed]="senhaVisivel()" (click)="alternarSenha()"><app-icone nome="olho" /></button>
        </div>
        @if (erroSenha(); as mensagem) {
          <p id="entrar-senha-erro" class="flux-campo__erro">{{ mensagem }}</p>
        }
      </div>
      @if (erro(); as mensagem) {
        <p role="alert" class="flux-alerta">{{ mensagem }}</p>
      }
      <button mat-flat-button type="submit" [disabled]="enviando()">{{ enviando() ? 'Entrando...' : 'Entrar' }}</button>
    </form>
    <p class="entrar__rodape">Finanças pessoais · código aberto</p>
  </div>
</main>
