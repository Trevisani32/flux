<app-marca class="navegacao__marca" />
<nav class="navegacao" aria-label="Menu principal">
  <p class="navegacao__grupo" id="navegacao-visao-geral">Visão geral</p>
  <ul class="navegacao__lista" aria-labelledby="navegacao-visao-geral">
    <li>
      <a class="navegacao__link" routerLink="/" routerLinkActive="navegacao__link--ativo" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }" (click)="navegou.emit()"><app-icone nome="inicio" />Início</a>
    </li>
    <li>
      <a class="navegacao__link" routerLink="/lancamentos" routerLinkActive="navegacao__link--ativo" ariaCurrentWhenActive="page" (click)="navegou.emit()"><app-icone nome="lancamentos" />Lançamentos</a>
    </li>
    <li>
      <a class="navegacao__link" routerLink="/importacao" routerLinkActive="navegacao__link--ativo" ariaCurrentWhenActive="page" (click)="navegou.emit()"><app-icone nome="importar" />Importação</a>

    <li>
      <a class="navegacao__link" routerLink="/contas" routerLinkActive="navegacao__link--ativo" ariaCurrentWhenActive="page" (click)="navegou.emit()"><app-icone nome="contas" />Contas</a>
    </li>

  <ul class="navegacao__lista" aria-labelledby="navegacao-organizacao">
    <li>

    </li>
    <li>
      <a class="navegacao__link" routerLink="/regras" routerLinkActive="navegacao__link--ativo" ariaCurrentWhenActive="page" (click)="navegou.emit()"><app-icone nome="regra" />Regras</a>
    </li>
