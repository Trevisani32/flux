<svg [attr.width]="largura()" [attr.height]="altura()" role="group" [attr.aria-label]="rotuloSvg()">
  @for (marca of marcas(); track marca) {
    <line
      class="grafico__marca"
      [class.grafico__marca--zero]="marca === 0"
      [attr.x1]="40"
      [attr.x2]="largura() - 4"
      [attr.y1]="y()(marca)"
      [attr.y2]="y()(marca)"
    />
    <text class="grafico__eixo" [attr.x]="32" [attr.y]="y()(marca) + 4" text-anchor="end">
      {{ textoDoEixo(marca) }}
    </text>
  }
  @for (item of colunas(); track item.mes) {
    <g
      class="grafico__grupo"
      [class.grafico__grupo--sel]="item.mes === selecionado()"
      [class.grafico__grupo--ativo]="ativo() === item.mes"
      tabindex="0"
      role="button"
      [attr.aria-label]="item.leitura"
      (pointerdown)="aoPointerDown($event)"
      (pointerenter)="entrar(item.mes, $event)"
      (pointerleave)="sair(item.mes, $event)"
      (focus)="focar(item.mes)"
      (blur)="desfocar(item.mes)"
      (click)="clicar(item.mes)"
      (keydown.enter)="escolher.emit(item.mes)"
      (keydown.space)="teclaEspaco($event, item.mes)"
    >
      <rect
        class="grafico__faixa"
        [attr.x]="item.cx - faixa() / 2"
        [attr.y]="8"
        [attr.width]="faixa()"
        [attr.height]="altura() - 42"
        rx="6"
      />
      <rect
        class="grafico__coluna grafico__coluna--receita"
        [attr.x]="item.receitaX"
        [attr.y]="item.receitaY"
        [attr.width]="larguraColuna()"
        [attr.height]="item.receitaAltura"
        [attr.rx]="item.receitaRaio"
      />
      <rect
        class="grafico__coluna grafico__coluna--despesa"
        [attr.x]="item.despesaX"
        [attr.y]="item.despesaY"
        [attr.width]="larguraColuna()"
        [attr.height]="item.despesaAltura"
        [attr.rx]="item.despesaRaio"
      />
      <text class="grafico__mes" [attr.x]="item.cx" [attr.y]="altura() - 18" text-anchor="middle">
        {{ item.rotulo }}
      </text>
      @if (item.ano !== null) {
        <text class="grafico__ano" [attr.x]="item.cx" [attr.y]="altura() - 5" text-anchor="middle">
          {{ item.ano }}
        </text>
      }
    </g>
  }
</svg>
@if (ativoItem(); as item) {
  <div
    class="grafico__balao"
    aria-hidden="true"
    [style.top.px]="8"
    [style.left.px]="esquerdaBalao(item.cx)"
    [style.right.px]="direitaBalao(item.cx)"
  >
    <b class="grafico__balao-titulo">{{ item.titulo }}</b>
    <span>Receitas {{ formatarMoeda(item.receitas) }}</span>
    <span>Despesas {{ formatarMoeda(item.despesas) }}</span>
    <span>Resultado {{ resultado(item.resultado) }}</span>
    <small class="grafico__dica">{{
      porToque() ? 'Toque de novo para ver este mês' : 'Clique para ver este mês'
    }}</small>
  </div>
}
