# Só para testes (job e2e da CI e conferência local): acrescenta o Mailpit e liga
# o cadastro público. Uso: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up
services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "8027:8025"
  api:
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      APP_URL_BASE: http://localhost:8088
      APP_CADASTRO_PUBLICO: "true"
      APP_CONTROLADOR_NOME: Responsável fictício
      APP_CONTROLADOR_EMAIL: privacidade@flux.local
      MAIL_HOST: mailpit
      MAIL_PORTA: "1025"
      MAIL_USUARIO: ""
      MAIL_SENHA: ""
      MAIL_AUTENTICACAO: "false"
      MAIL_STARTTLS: "false"
