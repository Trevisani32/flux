name: flux-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: flux_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - dados_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flux_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Captura os e-mails de dev: SMTP na 1026 e caixa de entrada em http://localhost:8026
  # (fora das portas padrão 1025/8025, para não colidir com o Mailpit de outro projeto).
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1026:1025"
      - "8026:8025"
volumes:
  dados_dev:
